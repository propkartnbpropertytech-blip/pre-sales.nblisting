name: Deploy PropKart Pre-Sales to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Pre-Sales Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Frontend
        run: npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_BACKEND_URL: https://propconnect.nbpropertytech.com
          VITE_LISTING_URL: https://listing.nbpropertytech.com
          VITE_PROPCONNECT_URL: https://propconnect.nbpropertytech.com

      - name: Deploy to Hostinger VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_ALT: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_PASSWORD_ALT: ${{ secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e
          echo "=========================================================="
          echo " Initiating Hostinger VPS CI/CD for PropKart Pre-Sales"
          echo " Target Showcase: presales.nbpropertytech.com"
          echo "=========================================================="

          if [ -z "$VPS_HOST" ]; then
            echo "::error::Missing required secret 'VPS_HOST'."
            exit 1
          fi

          TARGET_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^https\?://##' -e 's#/.*$##' -e 's/:[0-9]*$//')
          TARGET_PORT="${VPS_PORT:-22}"
          TARGET_USER="${VPS_USERNAME:-root}"
          ACTUAL_SSH_KEY="${VPS_SSH_KEY:-$VPS_SSH_KEY_ALT}"
          ACTUAL_PASSWORD="${VPS_PASSWORD:-$VPS_PASSWORD_ALT}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          cat << 'EOF' > "$HOME/.ssh/config"
          Host vps-target
            HostName TARGET_HOST_PLACEHOLDER
            User TARGET_USER_PLACEHOLDER
            Port TARGET_PORT_PLACEHOLDER
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          sed -i "s/TARGET_HOST_PLACEHOLDER/$TARGET_HOST/g" "$HOME/.ssh/config"
          sed -i "s/TARGET_USER_PLACEHOLDER/$TARGET_USER/g" "$HOME/.ssh/config"
          sed -i "s/TARGET_PORT_PLACEHOLDER/$TARGET_PORT/g" "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

          AUTH_SUCCESS=false

          if [ -n "$ACTUAL_SSH_KEY" ]; then
            echo "$ACTUAL_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
            chmod 600 "$HOME/.ssh/deploy_key"
            echo "  IdentityFile $HOME/.ssh/deploy_key" >> "$HOME/.ssh/config"

            if ssh -o BatchMode=yes vps-target "echo 'SSH Key OK'"; then
              AUTH_SUCCESS=true
            fi
          fi

          if [ "$AUTH_SUCCESS" = false ] && [ -n "$ACTUAL_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$ACTUAL_PASSWORD"
            sed -i '/IdentityFile/d' "$HOME/.ssh/config"
            rm -f "$HOME/.ssh/deploy_key"

            if sshpass -e ssh -o ConnectTimeout=20 vps-target "echo 'SSH Password OK'"; then
              AUTH_SUCCESS=true
            fi
          fi

          if [ "$AUTH_SUCCESS" = false ]; then
            echo "::error::SSH authentication failed."
            exit 1
          fi

          run_cmd() {
            if [ -f "$HOME/.ssh/deploy_key" ]; then
              ssh vps-target "$@"
            else
              sshpass -e ssh vps-target "$@"
            fi
          }

          run_scp() {
            if [ -f "$HOME/.ssh/deploy_key" ]; then
              scp -r "$@"
            else
              sshpass -e scp -r "$@"
            fi
          }

          echo ">>> 1. Creating directories on VPS..."
          run_cmd "mkdir -p /root/propconnect-stack/presales-dist"

          echo ">>> 2. Transferring configuration and script..."
          run_scp nginx.conf vps-target:/root/propconnect-stack/nginx-presales.conf
          run_scp deploy.sh vps-target:/root/propconnect-stack/deploy-presales.sh

          echo ">>> 3. Transferring build artifacts..."
          run_scp dist/* vps-target:/root/propconnect-stack/presales-dist/

          echo ">>> 4. Executing deployment script on VPS..."
          run_cmd "chmod +x /root/propconnect-stack/deploy-presales.sh && /root/propconnect-stack/deploy-presales.sh"

          echo "=========================================================="
          echo " ✔ PropKart Pre-Sales deployed and connected to Traefik!"
          echo " Accessible at: https://presales.nbpropertytech.com"
          echo "=========================================================="
