name: Deploy PropKart Pre-Sales to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Pre-Sales Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Frontend
        run: npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_BACKEND_URL: https://propconnect.nbpropertytech.com
          VITE_LISTING_URL: https://listing.nbpropertytech.com
          VITE_PROPCONNECT_URL: https://propconnect.nbpropertytech.com

      - name: Deploy to Hostinger VPS (Docker & Traefik)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD || secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "=========================================================="
          echo " Initiating Hostinger VPS CI/CD for PropKart Pre-Sales"
          echo " Target Showcase: presales.nbpropertytech.com"
          echo "=========================================================="

          # Check required Host
          if [ -z "$VPS_HOST" ]; then
            echo "::error::Missing required secret 'VPS_HOST'."
            exit 1
          fi

          TARGET_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^https\?://##' -e 's#/.*$##' -e 's/:[0-9]*$//')
          TARGET_PORT=$(printf '%s' "${VPS_PORT:-22}" | tr -dc '0-9')
          [ -z "$TARGET_PORT" ] && TARGET_PORT="22"
          TARGET_USER=$(printf '%s' "${VPS_USERNAME:-root}" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          [ -z "$TARGET_USER" ] && TARGET_USER="root"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          write_ssh_config() {
            local h="$1"
            local p="$2"
            local u="$3"
            {
              echo "Host vps-target"
              echo "  HostName $h"
              echo "  User $u"
              echo "  Port $p"
              [ -f "$HOME/.ssh/deploy_key" ] && echo "  IdentityFile $HOME/.ssh/deploy_key"
              echo "  StrictHostKeyChecking no"
              echo "  UserKnownHostsFile /dev/null"
              echo "  ConnectTimeout 20"
              echo "  ServerAliveInterval 30"
              echo "  ServerAliveCountMax 3"
            } > "$HOME/.ssh/config"
            chmod 600 "$HOME/.ssh/config"
          }

          AUTH_SUCCESS=false

          # 1. Try OpenSSH Key
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
            chmod 600 "$HOME/.ssh/deploy_key"
            write_ssh_config "$TARGET_HOST" "$TARGET_PORT" "$TARGET_USER"

            if ssh -o BatchMode=yes vps-target "echo 'SSH Key OK'"; then
              AUTH_SUCCESS=true
            fi
          fi

          # 2. Try Password fallback
          if [ "$AUTH_SUCCESS" = false ] && [ -n "$VPS_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$VPS_PASSWORD"
            rm -f "$HOME/.ssh/deploy_key"
            write_ssh_config "$TARGET_HOST" "$TARGET_PORT" "$TARGET_USER"

            if sshpass -e ssh -o ConnectTimeout=20 vps-target "echo 'SSH Password OK'"; then
              AUTH_SUCCESS=true
            fi
          fi

          if [ "$AUTH_SUCCESS" = false ]; then
            echo "::error::SSH authentication failed."
            exit 1
          fi

          run_cmd() {
            if [ -f "$HOME/.ssh/deploy_key" ]; then
              ssh vps-target "$@"
            else
              sshpass -e ssh vps-target "$@"
            fi
          }

          run_scp() {
            if [ -f "$HOME/.ssh/deploy_key" ]; then
              scp -r "$@"
            else
              sshpass -e scp -r "$@"
            fi
          }

          echo ">>> 1. Creating directories on VPS..."
          run_cmd "mkdir -p /root/propconnect-stack/presales-dist /var/www/pre-sales.nblisting"

          echo ">>> 2. Transferring production assets..."
          run_scp dist/* vps-target:/root/propconnect-stack/presales-dist/
          run_scp dist/* vps-target:/var/www/pre-sales.nblisting/

          echo ">>> 3. Writing Nginx SPA configuration..."
          run_cmd "cat << 'EOF' > /root/propconnect-stack/nginx-presales.conf
server {
    listen 80;
    server_name presales.nbpropertytech.com pre-sales.nblisting.com localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /api/v1/ {
        proxy_pass http://propconnect-api:5050/api/v1/;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
    }

    location /uploads/ {
        proxy_pass http://propconnect-api:5050/uploads/;
        proxy_set_header Host \$host;
    }

    location / {
        try_files \$uri \$uri/ /index.html;
    }
}
EOF"

          echo ">>> 4. Launching propkart-presales container with Traefik integration..."
          run_cmd "docker rm -f propkart-presales 2>/dev/null || true"
          run_cmd "docker run -d \
            --name propkart-presales \
            --restart unless-stopped \
            --network propconnect-network \
            -v /root/propconnect-stack/nginx-presales.conf:/etc/nginx/conf.d/default.conf:ro \
            -v /root/propconnect-stack/presales-dist:/usr/share/nginx/html:ro \
            -l 'traefik.enable=true' \
            -l 'traefik.http.routers.propkart-presales-live.rule=Host(\`presales.nbpropertytech.com\`) || Host(\`pre-sales.nblisting.com\`)' \
            -l 'traefik.http.routers.propkart-presales-live.entrypoints=websecure' \
            -l 'traefik.http.routers.propkart-presales-live.tls=true' \
            -l 'traefik.http.routers.propkart-presales-live.tls.certresolver=letsencrypt' \
            -l 'traefik.http.services.propkart-presales-live.loadbalancer.server.port=80' \
            nginx:alpine"

          echo ">>> 5. Reloading standby web servers..."
          run_cmd "systemctl reload nginx 2>/dev/null || true"

          echo "=========================================================="
          echo " ✔ PropKart Pre-Sales deployed and connected to Traefik!"
          echo " Accessible at: https://presales.nbpropertytech.com"
          echo "=========================================================="
